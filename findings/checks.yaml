# cf-account-review findings rulebook — v1 checks
#
# Every check carries:
#   id, name, domain, severity — the finding identity
#   tier — "lite" (public, binary checks) or "full" (SE-assisted, contextual checks)
#   applies.planTier — highest-confidence plan tier the check applies to
#   evidence — which part of the collection the check reads (documented for customers)
#   remediation — what to do about a fail
#   citation — the Cloudflare doc (or listed source) that justifies the check
#   compliance — (optional) compliance framework controls this check supports evidence for
#                (SOC 2 TSC codes, PCI DSS requirements). See docs/compliance-mapping.md.
#
# Verdict semantics:
#   pass | warn | fail | manual | na — and INCOMPLETE OR UNREADABLE EVIDENCE
#   CAN NEVER PASS. Missing data yields "manual", not "pass".
#
# Tier semantics:
#   lite — Binary checks (boolean flags, numeric thresholds) with unambiguous pass/fail.
#          No application context needed. Customer can self-remediate.
#   full — Contextual checks requiring app/architecture knowledge, threat modeling, or
#          compliance expertise. SE interpretation recommended.

checks:
  # ------------------------------------------------------------------ SSL/TLS
  - id: CF-SSL-001
    name: SSL/TLS encryption mode is Full (strict)
    domain: ssl-tls
    tier: lite
    severity: high
    type: zone_setting
    applies: { planTier: any }
    evidence: zones[].settings["ssl"]
    params: { settingId: ssl, expectOneOf: ["strict"] }
    warnIf: ["full", "origin_pull"]
    remediation: >
      Set SSL/TLS mode to Full (strict) in Zone > SSL/TLS > Overview. Flexible or Off
      modes allow unencrypted traffic between Cloudflare and your origin.
    citation: https://developers.cloudflare.com/ssl/origin-configuration/ssl-modes/
    compliance: ["SOC2-CC6.6", "PCI-DSS-4.2"]

  - id: CF-SSL-002
    name: Minimum TLS version is 1.2 or higher
    domain: ssl-tls
    tier: lite
    severity: high
    type: zone_setting
    applies: { planTier: any }
    evidence: zones[].settings["min_tls_version"]
    params: { settingId: min_tls_version, expectOneOf: ["1.2", "1.3"] }
    remediation: >
      Set Minimum TLS Version to 1.2 on Edge Certificates. TLS 1.0/1.1 have known
      vulnerabilities and are not strong cryptography under PCI DSS 4.2.1.
    citation: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/minimum-tls/
    compliance: ["SOC2-CC6.6", "PCI-DSS-4.2"]

  - id: CF-SSL-003
    name: HSTS is enabled
    domain: ssl-tls
    tier: lite
    severity: medium
    type: zone_setting
    applies: { planTier: any }
    evidence: zones[].settings["security_header"]
    params:
      settingId: security_header
      nested: { path: strict_transport_security.enabled, expect: true }
    remediation: >
      Enable HSTS on Edge Certificates. Confirm all subdomains support HTTPS first —
      HSTS forces HTTPS browser-side and can lock out HTTP-only hosts.
    citation: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/http-strict-transport-security/
    compliance: ["SOC2-CC6.6", "PCI-DSS-4.2"]

  - id: CF-SSL-004
    name: Always Use HTTPS is enabled
    domain: ssl-tls
    tier: lite
    severity: medium
    type: zone_setting
    applies: { planTier: any }
    evidence: zones[].settings["always_use_https"]
    params: { settingId: always_use_https, expect: "on" }
    remediation: >
      Enable Always Use HTTPS so no plaintext HTTP requests reach your application.
    citation: https://developers.cloudflare.com/ssl/edge-certificates/additional-options/always-use-https/
    compliance: ["SOC2-CC6.6"]

  - id: CF-SSL-005
    name: Custom certificates not expiring soon
    domain: ssl-tls
    tier: lite
    severity: high
    type: cert_expiry
    applies: { planTier: any }
    evidence: zones[].certificatePacks
    params: { warnDays: 90, failDays: 30 }
    remediation: >
      Custom certificates expiring within 30 days require immediate renewal.
      Upload a renewed certificate via SSL/TLS > Edge Certificates > Upload Custom SSL Certificate.
      Certificates expiring within 90 days should be scheduled for renewal.
      Universal certificates auto-renew; this check applies only to custom certificates.
    citation: https://developers.cloudflare.com/ssl/edge-certificates/custom-certificates/renewing/
    compliance: ["SOC2-CC6.6"]

  # -------------------------------------------------------- Security Settings
  - id: CF-SEC-001
    name: Under Attack Mode not left on inappropriately
    domain: security
    tier: lite
    severity: high
    type: security_level_check
    applies: { planTier: any }
    evidence: zones[].settings["security_level"]
    params: {}
    remediation: >
      Under Attack Mode (formerly "I'm Under Attack") challenges every visitor and
      breaks API/mobile traffic. It should be enabled only during active attacks,
      not left on permanently. Use temporary rules or firewall rules for sustained
      protection.
    citation: https://developers.cloudflare.com/fundamentals/reference/under-attack-mode/

  - id: CF-SEC-002
    name: Browser Integrity Check appropriate for zone type
    domain: security
    tier: full
    severity: medium
    type: browser_integrity_check
    applies: { planTier: any }
    evidence: zones[].settings["browser_check"]
    params: {}
    warnIf: ["enabled_on_api_zone"]
    remediation: >
      Browser Integrity Check blocks requests without common browser headers. This
      is appropriate for websites but breaks API clients, mobile apps, and headless
      browsers. Disable it on API zones or use firewall rules for granular control.
    citation: https://developers.cloudflare.com/waf/tools/browser-integrity-check/

  - id: CF-SEC-003
    name: Challenge Passage duration reasonable
    domain: security
    tier: lite
    severity: low
    type: challenge_passage_check
    applies: { planTier: any }
    evidence: zones[].settings["challenge_ttl"]
    params: {}
    warnIf: ["too_short", "too_long"]
    remediation: >
      Challenge Passage controls how long a solved challenge remains valid. Cloudflare
      recommends 15-45 minutes. Very short durations (<15 min) annoy users; very long
      durations (>60 min) allow compromised sessions to persist.
    citation: https://developers.cloudflare.com/waf/tools/challenge-passage/

  - id: CF-SEC-004
    name: Hotlink Protection appropriate for zone
    domain: security
    tier: full
    severity: low
    type: hotlink_protection_check
    applies: { planTier: any }
    evidence: zones[].settings["hotlink_protection"]
    params: {}
    warnIf: ["enabled_on_saas_or_api"]
    remediation: >
      Hotlink Protection blocks embedding of images from other domains. This is useful
      for image hosting sites but breaks SaaS products, APIs, and CDN-served assets
      meant to be embedded. Verify this matches your zone's purpose.
    citation: https://developers.cloudflare.com/waf/tools/hotlink-protection/

  # ------------------------------------------------------- Performance Settings
  - id: CF-PERF-001
    name: HTTP/2 enabled for performance
    domain: performance
    tier: lite
    severity: medium
    type: http2_check
    applies: { planTier: any }
    evidence: zones[].settings["http2"]
    params: {}
    remediation: >
      HTTP/2 improves page load times through multiplexing and header compression.
      It should be enabled unless you have a specific compatibility requirement.
      This is on by default; if it's off, verify the reason.
    citation: https://developers.cloudflare.com/speed/optimization/protocol/http2/

  - id: CF-PERF-002
    name: HTTP/3 (QUIC) enabled for performance
    domain: performance
    tier: lite
    severity: low
    type: http3_check
    applies: { planTier: any }
    evidence: zones[].settings["http3"]
    params: {}
    remediation: >
      HTTP/3 reduces latency on poor connections and is supported by all modern
      browsers. Enable it unless you have documented UDP/QUIC blocking issues.
      This is on by default on newer zones.
    citation: https://developers.cloudflare.com/speed/optimization/protocol/http3/

  - id: CF-PERF-003
    name: Brotli compression enabled
    domain: performance
    tier: lite
    severity: low
    type: brotli_check
    applies: { planTier: pro-plus }
    evidence: zones[].settings["brotli"]
    params: {}
    remediation: >
      Brotli compression reduces bandwidth usage by 15-25% compared to gzip for text
      content. All modern browsers support it. Enable via Speed > Optimization > Content Optimization.
    citation: https://developers.cloudflare.com/speed/optimization/content/brotli/

  # ------------------------------------------------------------------ WAF
  - id: CF-WAF-001
    name: Managed WAF ruleset deployed
    domain: waf
    tier: full
    severity: high
    type: phase_present
    applies: { planTier: pro-plus }
    evidence: zones[].phaseEntrypoints["http_request_firewall_managed"]
    params:
      phase: http_request_firewall_managed
      requireEnabledExecuteRule: true
      failIfAllOverridesDisabled: true
    remediation: >
      Deploy the Cloudflare Managed Ruleset (and OWASP Core Ruleset) from Security > Settings.
      The managed ruleset is updated weekly for CVE coverage; a zone without it has no
      signature-based exploit protection.
    citation: https://developers.cloudflare.com/waf/managed-rules/reference/cloudflare-managed-ruleset/
    compliance: ["SOC2-CC7.1", "SOC2-CC7.2", "PCI-DSS-6.4", "PCI-DSS-11.3"]

  - id: CF-WAF-002
    name: Custom WAF rules present for sensitive endpoints
    domain: waf
    tier: full
    severity: medium
    type: phase_present
    applies: { planTier: any }
    evidence: zones[].phaseEntrypoints["http_request_firewall_custom"]
    params:
      phase: http_request_firewall_custom
      warnIfNoBlockingAction: true
    remediation: >
      Review Security > Security rules. Custom rules should protect login/checkout/API
      paths; rules that are log-only on Business+ plans provide no enforcement.
    citation: https://developers.cloudflare.com/waf/custom-rules/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4"]

  - id: CF-WAF-003
    name: Broad skip rules are not neutralizing the WAF
    domain: waf
    tier: full
    severity: high
    type: broad_skip_audit
    applies: { planTier: any }
    evidence: zones[].phaseEntrypoints["http_request_firewall_custom"]
    params: {}
    remediation: >
      Skip rules with site-wide expressions (or missing run-time/locking configurations)
      disable protections for most traffic. Narrow skip scopes and separate
      onboarding vs enforcement rulesets.
    citation: https://developers.cloudflare.com/waf/managed-rules/waf-exceptions/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4"]

  # ------------------------------------------------------------------ Rate limiting
  - id: CF-RL-001
    name: Rate limiting rule protects login endpoints
    domain: rate-limiting
    tier: full
    severity: high
    type: ratelimit_login
    applies: { planTier: any }
    evidence: zones[].phaseEntrypoints["http_ratelimit"]
    params: { phase: http_ratelimit, loginPaths: ["/login", "/log-in", "/signin", "/api/login", "/auth"] }
    remediation: >
      Add a rate limiting rule for login POSTs (count IP, e.g. 4 failed attempts/min
      with response-code counting on Business+, escalating windows per the docs).
    citation: https://developers.cloudflare.com/waf/rate-limiting-rules/best-practices/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4"]

  # CF-RL-002 removed: the legacy rate_limits endpoint returns 410 Gone, so
  # the check could only pass vacuously on absent data. CF-RL-001 covers
  # current rate-limiting posture (http_ratelimit phase).

  # -------------------------------------------------- Response headers
  - id: CF-HDR-001
    name: Edge response transforms do not strip security headers
    domain: response-headers
    tier: full
    severity: medium
    type: response_header_transform
    applies: { planTier: any }
    evidence: zones[].phaseEntrypoints["http_response_headers_transform"]
    params: {}
    remediation: >
      A response header Transform Rule removes a security header
      (Strict-Transport-Security, Content-Security-Policy, X-Frame-Options, or
      X-Content-Type-Options) before it reaches the browser. Remove the header
      from the rule's headers_remove list unless there is a documented reason.
    citation: https://developers.cloudflare.com/rules/transform/response-header-modification/
    compliance: ["SOC2-CC6.6", "PCI-DSS-6.4"]

  # ------------------------------------------------------------------ Bots
  - id: CF-BOT-001
    name: Definite-bot block excludes verified bots
    domain: bots
    tier: full
    severity: medium
    type: bot_rules
    applies: { planTier: pro-plus }
    evidence: zones[].phaseEntrypoints["http_request_firewall_custom"]
    params: {}
    remediation: >
      Block expressions using cf.bot_management.score should include
      `not cf.bot_management.verified_bot`, or Googlebot and other verified crawlers
      (score=1) get blocked.
    citation: https://developers.cloudflare.com/bots/concepts/bot-score/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4"]

  - id: CF-BOT-002
    name: Bot management rules actually enforce (not skip-only)
    domain: bots
    tier: full
    severity: high
    type: bot_rules
    applies: { planTier: pro-plus }
    evidence: zones[].phaseEntrypoints["http_request_firewall_custom"]
    params: {}
    remediation: >
      Bot management rules that only skip other rules leave automation unenforced.
      Validate the intended tiered model: skip for verified bots, challenge for
      likely bots (score 1–30), block for definite bots — then enforce.
    citation: https://developers.cloudflare.com/bots/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4"]

  - id: CF-TS-001
    name: Turnstile widgets have domains bound
    domain: bots
    tier: lite
    severity: low
    type: turnstile
    applies: { planTier: any }
    evidence: accounts[].turnstileWidgets
    params: {}
    remediation: >
      A Turnstile widget with no bound domains cannot protect your forms. Bind the
      widget to the hostnames that serve the protected flows. Enforcement of
      sitekey usage cannot be verified over the API — mark for manual review.
    citation: https://developers.cloudflare.com/turnstile/get-started/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4"]

  # ------------------------------------------------------------------ Access
  - id: CF-ZT-001
    name: Access applications have policies attached
    domain: zero-trust
    tier: full
    severity: high
    type: access_apps
    applies: { planTier: any }
    evidence: accounts[].accessApps
    params: {}
    remediation: >
      Every Access application must have at least one allow policy; policies with
      decision "bypass" expose the app without authentication.
    citation: https://developers.cloudflare.com/cloudflare-one/policies/access/
    compliance: ["SOC2-CC6.1", "PCI-DSS-8.2"]

  - id: CF-ZT-002
    name: Identity providers beyond one-time PIN configured
    domain: zero-trust
    tier: lite
    severity: medium
    type: access_idps
    applies: { planTier: any }
    evidence: accounts[].accessIdentityProviders
    params: {}
    remediation: >
      An empty IdP list (OTP-only) means no centralized identity control. Integrate
      your corporate IdP.
    citation: https://developers.cloudflare.com/cloudflare-one/identity-providers/
    compliance: ["SOC2-CC6.1", "PCI-DSS-8.2"]

  - id: CF-ZT-003
    name: Two-factor authentication enforced on the account
    domain: account-hygiene
    tier: lite
    severity: high
    type: account_setting_flag
    applies: { planTier: any }
    evidence: accounts[].enforceTwofactor
    params: { flag: enforceTwofactor, expect: true }
    remediation: >
      Enable "Enforce 2FA" in account members settings so every member must use 2FA.
    citation: https://developers.cloudflare.com/fundamentals/account/account-security/mfa/
    compliance: ["SOC2-CC6.1", "PCI-DSS-8.2"]

  - id: CF-IAM-001
    name: API tokens have expiry set
    domain: account-hygiene
    tier: lite
    severity: medium
    type: token_expiry
    applies: { planTier: any }
    evidence: accounts[].apiTokens
    params: {}
    remediation: >
      Active tokens without expiration are standing credentials. Set expiry and
      rotate tokens in use.
    citation: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
    compliance: ["SOC2-CC6.1", "PCI-DSS-8.2"]

  # ------------------------------------------------------------------ DNS / unsecured endpoints
  - id: CF-DNS-001
    name: DNSSEC enabled
    domain: dns
    tier: lite
    severity: medium
    type: zone_setting
    applies: { planTier: any }
    evidence: zones[].settings["dnssec"]
    params: { settingId: dnssec, expect: "active" }
    remediation: >
      Enable DNSSEC in DNS > Settings to prevent response forgery.
    citation: https://developers.cloudflare.com/dns/dnssec/
    compliance: ["SOC2-CC6.6", "SOC2-CC6.7"]

  - id: CF-DNS-002
    name: CAA records present
    domain: dns
    tier: lite
    severity: low
    type: caa_present
    applies: { planTier: any }
    evidence: zones[].dnsRecords
    params: {}
    remediation: >
      Add CAA records restricting certificate issuance to your chosen CAs.
    citation: https://developers.cloudflare.com/dns/manage-dns-records/reference/dns-record-types/#caa
    compliance: ["SOC2-CC6.6"]

  - id: CF-DNS-003
    name: MX and SPF/DMARC email posture recorded
    domain: dns
    tier: full
    severity: low
    type: email_records
    applies: { planTier: any }
    evidence: zones[].dnsRecords
    params: {}
    remediation: >
      Zones sending mail should publish SPF/DMARC; zones that never send mail
      should publish null SPF and reject-DMARC records to prevent spoofing.
    citation: https://developers.cloudflare.com/dns/manage-dns-records/reference/dns-record-types/
    compliance: ["SOC2-CC6.6"]

  # ------------------------------------------------------------------ Workers
  - id: CF-WRK-001
    name: No zombie Workers (deployed, never routed)
    domain: workers
    tier: lite
    severity: medium
    type: zombie_workers
    applies: { planTier: any }
    evidence: accounts[].workersScripts + zones[].workersRoutes
    params: {}
    remediation: >
      Scripts deployed with no route on any audited zone are untracked attack
      surface (if reachable via workers.dev) or dead weight. Delete or route them.
    citation: https://developers.cloudflare.com/workers/configuration/routes/
    compliance: ["SOC2-CC8.1"]

  - id: CF-WRK-002
    name: Workers routes point to scripts that exist
    domain: workers
    tier: lite
    severity: high
    type: zombie_workers
    applies: { planTier: any }
    evidence: accounts[].workersScripts + zones[].workersRoutes
    params: {}
    remediation: >
      Routes referencing unknown scripts (or scripts the token cannot list)
      need manual confirmation — this verdict is "manual" unless both sides
      of the check were readable.
    citation: https://developers.cloudflare.com/workers/configuration/routes/
    compliance: ["SOC2-CC8.1"]

  # ------------------------------------------------------------------ Load Balancing
  - id: CF-LB-001
    name: Load balancer pools have multiple origins for failover
    domain: traffic
    tier: lite
    severity: high
    type: lb_pool_health
    applies: { planTier: any }
    evidence: accounts[].loadBalancerPools
    params: { minOrigins: 2 }
    remediation: >
      Pools with a single origin have no failover. Add a second origin for redundancy.
      If a single origin is intentional (e.g., DNS-only load balancing), ensure external
      monitoring alerts on outages — monitoring does not provide failover.
    citation: https://developers.cloudflare.com/load-balancing/pools/
    compliance: ["SOC2-A1.2"]

  - id: CF-LB-002
    name: Load balancer monitors use appropriate intervals
    domain: traffic
    tier: lite
    severity: medium
    type: lb_monitor_health
    applies: { planTier: any }
    evidence: accounts[].loadBalancerMonitors
    params: { maxIntervalSeconds: 60 }
    remediation: >
      Monitor intervals longer than 60 seconds may fail to detect outages quickly.
      Reduce the interval for production traffic pools.
    citation: https://developers.cloudflare.com/load-balancing/monitors/
    compliance: ["SOC2-A1.2"]

  # ------------------------------------------------------------------ AI Gateway
  - id: CF-AIG-001
    name: AI Gateways have rate limiting configured
    domain: ai-gateway
    tier: lite
    severity: high
    type: aig_rate_limiting
    applies: { planTier: any }
    evidence: accounts[].aiGateways
    params: {}
    remediation: >
      Configure rate limiting to prevent excessive costs and abuse. Set limits
      appropriate for your expected traffic volume via Settings > Rate-limiting.
    citation: https://developers.cloudflare.com/ai-gateway/features/rate-limiting/
    compliance: ["SOC2-CC7.2", "PCI-DSS-10.2"]

  - id: CF-AIG-002
    name: AI Gateways have authentication enabled
    domain: ai-gateway
    tier: lite
    severity: high
    type: aig_authentication
    applies: { planTier: any }
    evidence: accounts[].aiGateways
    params: {}
    remediation: >
      Enable authentication to prevent unauthorized access to your AI Gateway.
      Once enabled, authentication cannot be disabled.
    citation: https://developers.cloudflare.com/ai-gateway/get-started/
    compliance: ["SOC2-CC7.2"]

  - id: CF-AIG-003
    name: AI Gateways have log collection enabled
    domain: ai-gateway
    tier: lite
    severity: medium
    type: aig_logging
    applies: { planTier: any }
    evidence: accounts[].aiGateways
    params: {}
    remediation: >
      Enable log collection for audit trails, analytics, and debugging.
      Configure via Settings > Logging.
    citation: https://developers.cloudflare.com/ai-gateway/observability/logging/
    compliance: ["SOC2-CC7.1"]

  - id: CF-AIG-004
    name: AI Gateways have DLP policies configured
    domain: ai-gateway
    tier: full
    severity: medium
    type: aig_dlp
    applies: { planTier: any }
    evidence: accounts[].aiGateways
    params: {}
    warnIf: ["dlp_disabled"]
    remediation: >
      Configure Data Loss Prevention policies to prevent sensitive data leakage
      in prompts and responses. Set up DLP profiles via Settings > Data Loss Prevention.
    citation: https://developers.cloudflare.com/ai-gateway/
    compliance: ["SOC2-CC6.1", "PCI-DSS-8.2"]

  - id: CF-AIG-005
    name: AI Gateways have guardrails configured
    domain: ai-gateway
    tier: full
    severity: medium
    type: aig_guardrails
    applies: { planTier: any }
    evidence: accounts[].aiGateways
    params: {}
    warnIf: ["guardrails_absent"]
    remediation: >
      Configure guardrails to protect against prompt injection and other AI-specific
      attacks. Set up guardrail policies via Settings > Guardrails.
    citation: https://developers.cloudflare.com/ai-gateway/
    compliance: ["SOC2-CC7.2"]

  # ----------------------------------------------------- Client-Side Security
  - id: CF-PS-001
    name: Page Shield (Client-side security) enabled
    domain: client-side-security
    tier: full
    severity: medium
    type: page_shield_enabled
    applies: { planTier: business-plus }
    evidence: zones[].pageShield
    params: {}
    remediation: >
      Enable Page Shield to monitor client-side scripts, connections, and cookies
      loaded by your website visitors. Detect supply chain attacks and malicious
      third-party scripts.
    citation: https://developers.cloudflare.com/client-side-security/
    compliance: ["SOC2-CC7.1", "PCI-DSS-6.4", "PCI-DSS-11.3"]

  # --------------------------------------------------------- Origin Security
  - id: CF-AOP-001
    name: Authenticated Origin Pulls enabled
    domain: origin-security
    tier: lite
    severity: high
    type: authenticated_origin_pulls_enabled
    applies: { planTier: any }
    evidence: zones[].authenticatedOriginPulls
    params: {}
    remediation: >
      Enable Authenticated Origin Pulls to ensure requests to your origin server
      come from the Cloudflare network. Without AOP, anyone who discovers your
      origin IP can bypass Cloudflare protections.
    citation: https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/
    compliance: ["SOC2-CC6.6", "PCI-DSS-4.2"]

  - id: CF-AOP-002
    name: Zone-level Authenticated Origin Pulls preferred
    domain: origin-security
    tier: full
    severity: medium
    type: zone_level_aop_preferred
    applies: { planTier: any }
    evidence: zones[].authenticatedOriginPulls
    params: {}
    warnIf: ["global_only"]
    remediation: >
      Global AOP uses a shared Cloudflare certificate that only proves requests
      come from the Cloudflare network. Upload a zone-level certificate to guarantee
      requests come from YOUR account specifically.
    citation: https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/zone-level/
    compliance: ["SOC2-CC6.6", "PCI-DSS-4.2"]

  # ------------------------------------------------------------- DDoS / Cache
  - id: CF-DDOS-001
    name: HTTP DDoS managed ruleset not disabled
    domain: ddos
    tier: lite
    severity: high
    type: ddos_not_disabled
    applies: { planTier: any }
    evidence: zones[].phaseEntrypoints
    params: {}
    remediation: >
      HTTP DDoS managed rulesets should not be overridden to "disabled". This leaves
      your zone exposed to DDoS attacks. If you need to reduce sensitivity, use
      "log" mode or adjust sensitivity rather than disabling.
    citation: https://developers.cloudflare.com/ddos-protection/
    compliance: ["SOC2-A1.2", "PCI-DSS-6.4"]

  - id: CF-CACHE-001
    name: HTML not cached aggressively by default
    domain: cache
    tier: full
    severity: medium
    type: html_cache_check
    applies: { planTier: any }
    evidence: zones[].settings
    params: {}
    warnIf: ["aggressive_html_cache"]
    remediation: >
      Cloudflare does not cache HTML by default. Setting cache_level to "aggressive"
      caches HTML, which can serve stale content and bypass dynamic personalization.
      Use Cache Rules for selective HTML caching instead.
    citation: https://developers.cloudflare.com/cache/

  - id: CF-CACHE-002
    name: Development Mode not left on
    domain: cache
    tier: lite
    severity: high
    type: dev_mode_check
    applies: { planTier: any }
    evidence: zones[].settings["development_mode"]
    params: {}
    remediation: >
      Development Mode bypasses the cache and should only be enabled temporarily
      for testing. Leaving it on degrades performance and increases origin load.
      Turn it off once testing is complete.
    citation: https://developers.cloudflare.com/cache/how-to/development-mode/

  - id: CF-CACHE-003
    name: Browser Cache TTL appropriate for content
    domain: cache
    tier: full
    severity: low
    type: browser_cache_ttl_check
    applies: { planTier: any }
    evidence: zones[].settings["browser_cache_ttl"]
    params: {}
    warnIf: ["very_short", "very_long"]
    remediation: >
      Browser Cache TTL controls how long browsers cache content. Default is 4 hours.
      Very short TTLs (<1 hour) may cause unnecessary origin requests. Very long TTLs
      (>1 day) may serve stale content. Use Cache Rules for fine-grained control.
    citation: https://developers.cloudflare.com/cache/how-to/edge-browser-cache-ttl/

  - id: CF-CACHE-004
    name: Cache Level matches zone purpose
    domain: cache
    tier: full
    severity: medium
    type: cache_level_check
    applies: { planTier: any }
    evidence: zones[].settings["cache_level"]
    params: {}
    warnIf: ["aggressive_on_dynamic_site", "bypass_on_static_site"]
    remediation: >
      Cache Level controls which resources Cloudflare caches. "No Query String"
      ignores query parameters and may break dynamic sites. "Bypass" defeats caching
      entirely. Use "Standard" for most sites, or Cache Rules for granular control.
    citation: https://developers.cloudflare.com/cache/how-to/cache-level/

  # -------------------------------------------------------------- Zero Trust
  - id: CF-TUNNEL-001
    name: Public tunnel routes protected by Access
    domain: zero-trust
    tier: full
    severity: high
    type: tunnel_access_gap
    applies: { planTier: any }
    evidence: accounts[].cfdTunnels, accounts[].accessApps
    params: {}
    remediation: >
      Create Access applications BEFORE adding public hostname routes to Cloudflare
      Tunnels. The moment a public hostname is added, a live DNS record is created.
      Without an Access app, your origin is exposed to the entire Internet.
    citation: https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/
    compliance: ["SOC2-CC6.1", "PCI-DSS-8.2"]
