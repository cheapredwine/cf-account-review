name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: CLI smoke — analyze committed fixture (exercises guarded report write)
        run: node dist/cli.js analyze tests/fixtures/collection-fixture.json --out /tmp/smoke-report.md
      - name: CLI smoke — diff mode (same collection → no changes)
        run: |
          node dist/cli.js analyze tests/fixtures/collection-fixture.json \
            --compare-to tests/fixtures/collection-fixture.json --diff-only \
            --out /tmp/smoke-diff.md
          grep -q "No findings changed since the previous collection." /tmp/smoke-diff.md
      - name: CLI smoke — collection JSON schema is committed and current
        run: |
          node dist/cli.js schema --out /tmp/collection.schema.json
          diff -q /tmp/collection.schema.json collection.schema.json
      - name: shellcheck + shfmt check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck collectors/sh/collect-config.sh
      - name: bash syntax check
        run: bash -n collectors/sh/collect-config.sh

  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - name: build standalone binary (linux x64)
        run: ./scripts/build-binary.sh
      - name: smoke the binary
        run: |
          ./dist/cf-account-review-linux-x64 --help
          ./dist/cf-account-review-linux-x64 analyze tests/fixtures/collection-fixture.json --out /tmp/smoke.md
      - uses: actions/upload-artifact@v4
        with:
          name: cf-account-review-linux-x64
          path: dist/cf-account-review-linux-x64

  windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - name: build standalone binary (windows x64)
        shell: pwsh
        run: ./scripts/build-binary.ps1
      - name: smoke the binary
        shell: pwsh
        run: ./dist/cf-account-review-win-x64.exe analyze tests/fixtures/collection-fixture.json --out $env:TEMP\smoke.md
      - uses: actions/upload-artifact@v4
        with:
          name: cf-account-review-win-x64
          path: dist/cf-account-review-win-x64.exe
      - name: PowerShell 5.1 syntax check (customer machines run Windows PowerShell)
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'collectors/ps/Collect-CFConfig.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path collectors/ps/Collect-CFConfig.ps1 -Severity Error
          if ($results.Count -gt 0) { $results | Format-Table; exit 1 }
          Write-Host "PSScriptAnalyzer: no errors"
