name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: shellcheck + shfmt check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck collectors/sh/collect-config.sh
      - name: bash syntax check
        run: bash -n collectors/sh/collect-config.sh
      - name: citation links resolve
        run: node scripts/check-citations.mjs
      - name: analyzer smoke (committed fixture)
        run: |
          node dist/cli.js analyze tests/fixtures/web-security-collection.json --out /tmp/report.md --profile all
          grep -q "CF-WAF-001" /tmp/report.md
